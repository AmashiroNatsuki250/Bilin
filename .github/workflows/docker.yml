name: Bilin Docker

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Core build workflow run ID from this repository'
        type: number
        required: true
      image_tag:
        description: 'Tag for this image build'
        type: string
        required: true
      mark_latest:
        description: 'Also publish the latest tag'
        type: boolean
        default: false
      mark_unstable:
        description: 'Also publish the unstable tag'
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate inputs
        if: inputs.mark_latest && inputs.mark_unstable
        run: exit 1
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: dawidd6/action-download-artifact@v11
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ inputs.run_id }}
          repo: ${{ github.repository }}
          path: docker_context
      - name: Prepare image tags
        id: tags
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          MARK_LATEST: ${{ inputs.mark_latest }}
          MARK_UNSTABLE: ${{ inputs.mark_unstable }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid Docker tag"
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bilin"
          tags="$image:$IMAGE_TAG"
          if [[ "$MARK_LATEST" == true ]]; then tags="$tags,$image:latest"; fi
          if [[ "$MARK_UNSTABLE" == true ]]; then tags="$tags,$image:unstable"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./docker_context
          platforms: linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/riscv64,linux/ppc64le
          push: true
          file: .github/workflows/Dockerfile
          tags: ${{ steps.tags.outputs.tags }}
