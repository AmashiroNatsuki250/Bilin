[package]
name = "bilin-mini"
description = "Minimal native Bilin node with TCP/UDP tunnels, TUN and UDP hole punching."
version = "2.7.1"
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE"
build = "build.rs"

[dependencies]
anyhow.workspace = true
bilin = { workspace = true, features = [
    "aes-gcm",
    "dhcp-ipv4",
    "icmp-proxy",
    "logging",
    "proxy-cidr-monitor",
    "smoltcp",
    "tun",
    "web-client",
] }
tokio = { workspace = true, features = ["macros", "rt", "signal"] }
